[project]
name = "django-rest-homeworks"
version = "0.1.0"
description = ""
authors = [
    {name = "Alex Valenko",email = "valenko.a.geo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "django-phonenumber-field[phonenumberslite] (>=9.0.0,<10.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

